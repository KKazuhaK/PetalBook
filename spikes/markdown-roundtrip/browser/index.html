<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PetalBook 编辑器验证</title>
    <style>
      :root {
        --bg: #faf9f7; --panel: #fff; --ink: #1f1d1a; --muted: #77726a; --line: #e4e0d8;
        --accent: #3f6b4f; --ok: #2f7d4f; --bad: #b3402e; --code: #f1eee8;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #171614; --panel: #1f1e1b; --ink: #ebe7df; --muted: #9a948a; --line: #34322d; --accent: #8fc3a0; --ok: #7fcf9c; --bad: #ef8f7c; --code: #2a2824; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
      header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      #status { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); }
      #status.ok { color: var(--ok); border-color: var(--ok); }
      #status.bad { color: var(--bad); border-color: var(--bad); }
      main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px; }
      @media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); } }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
      section > h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0; padding: 8px 14px; border-bottom: 1px solid var(--line); letter-spacing: 0.04em; }
      #toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
      button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
      .ProseMirror { padding: 18px 22px; min-height: 420px; outline: none; font-size: 16px; line-height: 1.85; }
      .ProseMirror > * + * { margin-top: 0.8em; }
      .ProseMirror h1 { font-size: 1.6em; line-height: 1.3; } .ProseMirror h2 { font-size: 1.3em; } .ProseMirror h3 { font-size: 1.1em; }
      .ProseMirror p { margin: 0; }
      .ProseMirror blockquote { margin-left: 0; padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }
      .ProseMirror code { background: var(--code); border-radius: 4px; padding: 1px 5px; font-size: 0.9em; }
      .ProseMirror pre { background: var(--code); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
      .ProseMirror pre code { background: none; padding: 0; }
      .ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: 4px; }
      .ProseMirror ul[data-type="taskList"] li { display: flex; gap: 8px; }
      .ProseMirror ul[data-type="taskList"] li > div { flex: 1; }
      .ProseMirror table { border-collapse: collapse; width: 100%; }
      .ProseMirror th, .ProseMirror td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; vertical-align: top; }
      .ProseMirror th { background: var(--code); }
      .ProseMirror img { max-width: 100%; border-radius: 6px; }
      .ProseMirror a { color: var(--accent); }
      .ProseMirror hr { border: none; border-top: 1px solid var(--line); }
      [data-raw-block], [data-raw-inline] { background: var(--code); color: var(--muted); font-size: 0.85em; }
      [data-footnote-ref] { color: var(--accent); }
      [data-footnote-def] { display: block; border-top: 1px dashed var(--line); font-size: 0.9em; color: var(--muted); }
      #markdown { display: block; width: 100%; margin: 0; padding: 14px 18px; min-height: 480px; border: 0; outline: none; resize: vertical; background: transparent; color: inherit; white-space: pre-wrap; word-break: break-word; font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .modes { display: inline-flex; }
      .modes button { border-radius: 0; margin-left: -1px; }
      .modes button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
      .modes button:last-child { border-radius: 0 6px 6px 0; }
      main[data-mode="wysiwyg"], main[data-mode="source"] { grid-template-columns: minmax(0, 760px); justify-content: center; }
      main[data-mode="wysiwyg"] #pane-source, main[data-mode="source"] #pane-editor { display: none; }
      #toolbar .sep { width: 1px; background: var(--line); margin: 2px 4px; }
      #diff { margin: 0; padding: 10px 18px; border-top: 1px solid var(--line); color: var(--bad); white-space: pre-wrap; font: 12px/1.6 ui-monospace, monospace; }
      #diff:empty { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>PetalBook 编辑器验证</h1>
      <span id="status">—</span>
      <span class="modes" role="group" aria-label="编辑模式">
        <button data-mode="wysiwyg">所见即所得</button><button data-mode="split">左右对照</button><button data-mode="source">Markdown</button>
      </span>
      <button id="reload" title="把右边的 Markdown 重新读进编辑器，模拟保存后再打开">保存后重新打开</button>
      <button id="sample">载入示例</button>
      <button id="clear">清空</button>
    </header>
    <main data-mode="wysiwyg">
      <section id="pane-editor">
        <h2>编辑器</h2>
        <div id="toolbar"></div>
        <div id="editor"></div>
      </section>
      <section id="pane-source">
        <h2>Markdown 原文（可以直接改）</h2>
        <textarea id="markdown" spellcheck="false" aria-label="Markdown 原文"></textarea>
        <pre id="diff"></pre>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
