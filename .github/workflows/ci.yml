name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  go-sqlite:
    name: Go (vet, tests on SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./cmd/... ./internal/...

  go-postgres:
    name: Go (tests on SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: petalbook
          POSTGRES_PASSWORD: petalbook
          POSTGRES_DB: petalbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petalbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PETALBOOK_TEST_POSTGRES: postgres://petalbook:petalbook@127.0.0.1:5432/petalbook_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./cmd/... ./internal/...

  web:
    name: Web (typecheck, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
