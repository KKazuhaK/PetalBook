# Monthly, grouped updates: weekly would be noise for a project this size.
# Actions stay pinned by commit SHA; Dependabot updates the SHA and the
# version comment together.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(web)
    groups:
      web:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/go]
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]
