name: Go
description: Install the Go version in go.mod, with the module and build caches, and fail if any other Go is on PATH.

inputs:
  cache-suffix:
    description: Added to the cache key. A job that builds little (lint) gives its own, so it does not save a thin cache under the key of the job that builds the most (go, the race build).
    default: ""

runs:
  using: composite
  steps:
    # Caches the downloaded modules and the build cache (compiled packages, race
    # builds included) under a key made of go.sum.
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum
        cache-suffix: ${{ inputs.cache-suffix }}
    # setup-go installs the go line of go.mod; fail if any other Go is on PATH.
    - name: Go version matches go.mod
      shell: bash
      run: |
        want="$(go list -m -f '{{.GoVersion}}')"
        case "$(go env GOVERSION)" in
          "go$want" | "go$want".*) ;;
          *) echo "go.mod says $want but $(go env GOVERSION) is running"; exit 1 ;;
        esac
